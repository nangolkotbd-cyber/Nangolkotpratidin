<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাঙ্গলকোট প্রতিদিন</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans Bengali",sans-serif;background:#f4f4f4;color:#222}
  header{background:#b71c1c;color:#fff;text-align:center;padding:16px}
  header h1{font-size:28px}
  header p{font-size:13px;opacity:.9}
  nav{background:#222;display:flex;overflow-x:auto;white-space:nowrap}
  nav a{color:#fff;text-decoration:none;padding:12px 16px;font-size:15px}
  nav a:hover{background:#b71c1c}
  main{max-width:900px;margin:auto;padding:12px}
  .lead{background:#fff;border-left:5px solid #b71c1c;padding:16px;margin-bottom:14px}
  .lead h2{font-size:24px;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .card{background:#fff;padding:14px;border-radius:6px;box-shadow:0 1px 3px #0002}
  .tag{display:inline-block;background:#b71c1c;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;margin-bottom:6px}
  .card h3{font-size:18px;margin-bottom:6px}
  .card p,.lead p{font-size:14px;color:#555;line-height:1.6}
  .time{font-size:12px;color:#888;margin-top:8px}
  footer{background:#222;color:#ccc;text-align:center;padding:16px;margin-top:20px;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>নাঙ্গলকোট প্রতিদিন</h1>
  <p>আপনার এলাকার প্রতিদিনের খবর</p>
</header>

<nav>
  <a href="#">প্রধান পাতা</a>
  <a href="#">স্থানীয়</a>
  <a href="#">রাজনীতি</a>
  <a href="#">শিক্ষা</a>
  <a href="#">খেলা</a>
  <a href="#">অপরাধ</a>
  <a href="#">যোগাযোগ</a>
</nav>

<main>
  <section class="lead">
    <span class="tag">প্রধান খবর</span>
    <h2>এখানে আজকের প্রধান শিরোনাম লিখুন</h2>
    <p>এখানে সংবাদের সংক্ষিপ্ত বিবরণ লিখুন। প্রতিবেদনের মূল তথ্য এখানে থাকবে।</p>
